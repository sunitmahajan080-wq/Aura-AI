<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; height: 90vh; background: #1e293b; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { background: #3b82f6; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; color: white; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; background: #0f172a; gap: 8px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #1e293b; color: white; outline: none; }
        button { padding: 12px 18px; border: none; background: #3b82f6; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">✨ Aura AI Assistant</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Namaste! Main Aura AI hoon. Main aapki kya madad kar sakta hoon?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Kuch bhi puchiye..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message bot-message" id="${loadingId}">Soch raha hoon...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                document.getElementById(loadingId).innerText = data.reply || "Koi response nahi mila.";
            } catch (err) {
                document.getElementById(loadingId).innerText = "Error: Server se connect nahi ho paya.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
